apiVersion: v2
name: redis-ha
description: |
  Redis hautement disponible sur Kubernetes : replication master/replica,
  bascule automatique par Redis Sentinel, anti-affinite, PodDisruptionBudget,
  min-replicas-to-write et metriques Prometheus. Exposition native via
  Envoy Gateway (Gateway API), avec routage vers le master courant.
type: application
version: 1.1.0
appVersion: "7.4.5"
keywords:
  - redis
  - sentinel
  - cache
  - key-value
  - ha
  - failover
  - envoy-gateway
  - gateway-api
home: https://redis.io
sources:
  - https://github.com/redis/redis
icon: https://redis.io/wp-content/uploads/2024/04/Logotype.svg
annotations:
  category: Database
