{{- if .Values.serviceAccount.create }}
{{/*
Contrairement a un cluster RabbitMQ, aucun composant de ce chart n'appelle
l'API Kubernetes : Sentinel se decouvre par DNS via le service headless.
Le ServiceAccount existe donc uniquement pour isoler les pods du compte
"default" du namespace, et son jeton n'est pas monte.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-ha.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-ha.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
