{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis-ha.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-ha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redis-ha.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Trafic interne au groupe : replication (6379) et dialogue entre
    # sentinels (26379). Sans cette regle, ni la replication ni la bascule
    # ne peuvent fonctionner.
    - from:
        - podSelector:
            matchLabels:
              {{- include "redis-ha.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.ports.redis }}
          protocol: TCP
        - port: {{ .Values.service.ports.sentinel }}
          protocol: TCP
    {{- if .Values.networkPolicy.allowExternal }}
    - ports:
        - port: {{ .Values.service.ports.redis }}
          protocol: TCP
        - port: {{ .Values.service.ports.sentinel }}
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: {{ .Values.service.ports.metrics }}
          protocol: TCP
        {{- if .Values.metrics.sentinel.enabled }}
        - port: {{ .Values.service.ports.sentinelMetrics }}
          protocol: TCP
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.envoyGateway.enabled }}
    {{- $eg := .Values.envoyGateway }}
    {{- if or $eg.networkPolicy.namespaceSelector $eg.networkPolicy.podSelector }}
    # Proxy Envoy Gateway. Il vit dans un autre namespace que Redis : sans
    # cette regle, allowExternal=false coupe le gateway comme n'importe quel
    # autre client, y compris ses sondes de sante — plus aucun endpoint ne
    # serait retenu, donc plus aucun trafic.
    {{- $peer := dict }}
    {{- with $eg.networkPolicy.namespaceSelector }}
    {{- $peer = set $peer "namespaceSelector" (dict "matchLabels" .) }}
    {{- end }}
    {{- with $eg.networkPolicy.podSelector }}
    {{- $peer = set $peer "podSelector" (dict "matchLabels" .) }}
    {{- end }}
    - from:
        - {{- toYaml $peer | nindent 10 }}
      ports:
        {{- if $eg.redis.enabled }}
        - port: {{ .Values.service.ports.redis }}
          protocol: TCP
        {{- end }}
        {{- if $eg.sentinel.enabled }}
        - port: {{ .Values.service.ports.sentinel }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
