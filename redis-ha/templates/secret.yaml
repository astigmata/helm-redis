{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis-ha.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-ha.labels" . | nindent 4 }}
  annotations:
    # Le mot de passe n'est genere que s'il n'existe pas encore : le regenerer
    # couperait la replication (masterauth) et l'authentification entre
    # sentinels. helm.sh/resource-policy protege le Secret d'un `helm uninstall`.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  redis-password: {{ include "redis-ha.password" . | b64enc | quote }}
{{- end }}
